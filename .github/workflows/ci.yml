name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: salash-${{ matrix.os }}
          path: target/release/salash
  # Required status check on main: pending while CI runs (blocks merging),
  # green once it finishes, whether build passed or not.
  ci-done:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "build finished with ${{ needs.build.result }}"
